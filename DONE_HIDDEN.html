<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST-RISK V6 PRO | TRX PREDICTOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05080f;
            --card: #0f172a;
            --cyan: #22d3ee;
            --pink: #f472b6;
            --green: #34d399;
            --red: #f87171;
            --text: #e2e8f0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* --- LOGIN LAYER --- */
        #security-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #111827 0%, #05080f 100%);
            z-index: 10000; display: flex; justify-content: center; align-items: center;
        }

        .login-box {
            background: var(--card); padding: 35px; border-radius: 20px;
            border: 1px solid var(--cyan); box-shadow: 0 0 25px rgba(34, 211, 238, 0.2);
            width: 300px; text-align: center;
        }

        .input-field {
            width: 100%; padding: 12px; margin: 15px 0;
            background: #000; border: 1px solid #334155;
            color: var(--cyan); border-radius: 8px; font-family: 'Orbitron';
            text-align: center; outline: none; box-sizing: border-box;
        }

        .btn-main {
            width: 100%; padding: 12px; border-radius: 8px;
            background: var(--cyan); color: #000; font-weight: bold;
            border: none; cursor: pointer; font-family: 'Orbitron'; transition: 0.3s;
        }

        /* --- MAIN UI --- */
        .container { width: 95%; max-width: 450px; padding: 20px; }
        
        .display-panel {
            background: var(--card); border-radius: 25px; padding: 30px;
            border: 1px solid rgba(255,255,255,0.05); text-align: center;
            position: relative; margin-top: 10px;
        }

        .timer-box {
            font-size: 3.5rem; font-weight: bold; font-family: 'Orbitron';
            color: #fff; text-shadow: 0 0 15px var(--cyan);
        }

        #prediction-output {
            font-size: 3.2rem; font-weight: 800; margin: 25px 0;
            letter-spacing: 4px; color: var(--pink); height: 80px;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.3);
        }

        .info-bar {
            display: flex; justify-content: space-between; gap: 10px; margin-top: 20px;
        }

        .info-item {
            flex: 1; background: var(--card); padding: 12px; border-radius: 12px;
            font-size: 0.8rem; border-left: 3px solid var(--cyan);
        }

        /* --- HISTORY TABLE --- */
        .history-card {
            background: var(--card); border-radius: 15px; margin-top: 20px;
            padding: 15px; margin-bottom: 40px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { color: var(--cyan); font-size: 0.7rem; padding: 10px; text-transform: uppercase; border-bottom: 1px solid #1e293b; }
        td { padding: 12px 5px; font-size: 0.85rem; border-bottom: 1px solid #1e293b; text-align: center; }

        .win { color: var(--green); font-weight: bold; }
        .lose { color: var(--red); font-weight: bold; }

        /* Lock Overlay */
        #maintenance {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 20000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <div id="security-layer">
        <div class="login-box">
            <h2 style="color:var(--cyan); font-family:'Orbitron'; margin:0;">GHOST V6</h2>
            <p style="font-size:0.7rem; opacity:0.6;">AUTHORIZATION REQUIRED</p>
            <input type="text" id="access-key" class="input-field" placeholder="ENTER KEY">
            <button class="btn-main" onclick="handleLogin()">ACTIVATE</button>
            <div id="err-log" style="color:var(--red); font-size:0.75rem; margin-top:10px;"></div>
        </div>
    </div>

    <div id="maintenance">
        <h1 style="color:var(--red); font-family:'Orbitron'">SYSTEM LOCKED</h1>
        <p>Server is closed by Admin. Access Denied.</p>
    </div>

    <div id="app-body" style="display:none;" class="container">
        <div style="text-align:center; margin-bottom:15px;">
            <h2 style="margin:0; font-family:'Orbitron'; color:var(--cyan);">TRX PREDICTOR</h2>
            <span id="server-status" style="font-size:0.65rem; color:var(--green);">● LIVE DATA CONNECTION</span>
        </div>

        <div class="display-panel">
            <div style="font-size:0.7rem; letter-spacing:3px; opacity:0.6;">MYANMAR TIME TIMER</div>
            <div id="timer" class="timer-box">00:00</div>
            <div id="prediction-output">ANALYZING...</div>
            <div style="font-size:0.65rem; opacity:0.4;">V6 ENGINE: HISTORICAL DATA SYNC</div>
        </div>

        <div class="info-bar">
            <div class="info-item">
                <div style="opacity:0.5; font-size:0.6rem;">DEVICE ID</div>
                <div id="my-uid" style="color:var(--green)">---</div>
            </div>
            <div class="info-item">
                <div style="opacity:0.5; font-size:0.6rem;">KEY STATUS</div>
                <div id="my-key" style="color:var(--cyan)">---</div>
            </div>
        </div>

        <div class="history-card">
            <h4 style="margin:5px 0 15px 0; color:var(--cyan);">RECENT HISTORY</h4>
            <table>
                <thead>
                    <tr><th>PERIOD</th><th>PREDICT</th><th>ACTUAL</th><th>RESULT</th></tr>
                </thead>
                <tbody id="hist-rows"></tbody>
            </table>
        </div>
    </div>
