<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST-RISK V6 PRO | OLD STYLE RED</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0000;
            --card: #1a0505;
            --red-glow: #ff0000;
            --red-dark: #8b0000;
            --text: #ff9999;
            --white: #ffffff;
        }

        body {
            background: var(--bg); color: var(--text);
            font-family: 'Rajdhani', sans-serif; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; border: 2px solid var(--red-dark); box-sizing: border-box;
        }

        /* --- LOGIN LAYER --- */
        #security-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: var(--card); padding: 35px; border-radius: 10px;
            border: 2px solid var(--red-glow); box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
            width: 300px; text-align: center;
        }
        .input-field {
            width: 100%; padding: 12px; margin: 15px 0; background: #000; border: 1px solid var(--red-dark);
            color: var(--red-glow); border-radius: 4px; font-family: 'Orbitron'; text-align: center; outline: none; box-sizing: border-box;
        }
        .btn-main {
            width: 100%; padding: 12px; border-radius: 4px; background: var(--red-glow); color: #000; font-weight: bold;
            border: none; cursor: pointer; font-family: 'Orbitron'; transition: 0.3s; text-transform: uppercase;
        }

        /* --- MAIN UI --- */
        .container { width: 95%; max-width: 450px; padding: 20px; }
        .display-panel {
            background: var(--card); border-radius: 15px; padding: 30px; border: 2px solid var(--red-dark);
            text-align: center; position: relative; margin-top: 10px; box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.2);
        }
        .timer-box { font-size: 3.5rem; font-weight: bold; font-family: 'Orbitron'; color: var(--white); text-shadow: 0 0 20px var(--red-glow); }
        #prediction-output {
            font-size: 3.5rem; font-weight: 900; margin: 25px 0; letter-spacing: 5px; color: var(--red-glow);
            height: 80px; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 15px rgba(255, 0, 0, 0.6); font-family: 'Orbitron';
        }
        .info-bar { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .info-item { flex: 1; background: var(--card); padding: 12px; border-radius: 8px; font-size: 0.8rem; border: 1px solid var(--red-dark); }
        .history-card { background: #000; border-radius: 10px; margin-top: 20px; padding: 15px; margin-bottom: 40px; border: 1px solid var(--red-dark); }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--red-glow); font-size: 0.75rem; padding: 10px; text-transform: uppercase; border-bottom: 2px solid var(--red-dark); }
        td { padding: 12px 5px; font-size: 0.85rem; border-bottom: 1px solid #300; text-align: center; color: #ffcccc; }
        .win { color: #00ff00; font-weight: bold; text-shadow: 0 0 5px #00ff00; }
        .lose { color: #ff0000; font-weight: bold; text-shadow: 0 0 5px #ff0000; }

        #maintenance {
            position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 20000;
            display: none; flex-direction: column; justify-content: center; align-items: center; color: var(--red-glow); text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

    <div id="security-layer">
        <div class="login-box">
            <h2 style="color:var(--red-glow); font-family:'Orbitron'; margin:0;">GHOST V6</h2>
            <p style="font-size:0.7rem; color:var(--text);">SECURITY CLEARANCE REQUIRED</p>
            <input type="text" id="access-key" class="input-field" placeholder="PASSKEY">
            <button class="btn-main" onclick="handleLogin()">ACCESS SYSTEM</button>
            <div id="err-log" style="color:#ff4444; font-size:0.75rem; margin-top:10px;"></div>
        </div>
    </div>

    <div id="maintenance">
        <h1 id="m-title" style="font-family:'Orbitron'">SYSTEM HALTED</h1>
        <p id="m-msg">REMOTE LOCK ACTIVE - BY RN RISK</p>
    </div>

            <span id="server-status" style="font-size:0.65rem; color:#ff3333;">[ SEARCHING SERVER... ]</span>

        <div class="display-panel">

                <div id="my-uid" style="color:#fff">---</div>

            <div class="info-item">
                <div style="opacity:0.6; font-size:0.6rem; color:var(--red-glow)">LEVEL</div>
                <div id="martingale-level" style="color:var(--white); font-weight:bold;">1x</div>
            </div>
            <div class="info-item">
                <div style="opacity:0.6; font-size:0.6rem; color:var(--red-glow)">STATUS</div>
                <div id="my-key" style="color:#00ff00">SECURE</div>
            </div>
        </div>

        <div class="history-card">

                </thead>

        </div>
